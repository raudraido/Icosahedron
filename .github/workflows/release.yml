name: Release

# One button for every product: Actions -> Release -> Run workflow.
# It bumps the product's version, turns the changelog's "## Unreleased" section into
# "## X.Y.Z", commits that to master, tags it and starts the product's build workflow,
# which publishes the GitHub release. See docs/releasing.md.
# Channel "beta" tags X.Y.Z-beta.N and publishes a pre-release; "stable" publishes the real release.
on:
  workflow_dispatch:
    inputs:
      product:
        description: Product to release
        type: choice
        required: true
        options: [desktop, server, ios, android-phone, android]
      version:
        description: "patch, minor, major or an exact X.Y.Z"
        type: string
        default: patch
        required: true
      channel:
        description: "stable = a normal release; beta = a pre-release for testers (tag X.Y.Z-beta.N)"
        type: choice
        default: stable
        options: [stable, beta]
      rebuild:
        description: "Rebuild with no changes: no 'Unreleased' needed, the release text says so"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency: release   # one release at a time, so two never bump master together

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0   # all tags: the beta number and the "pending beta" check read them

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild without changes (adds the changelog text)
        if: ${{ inputs.rebuild }}
        run: |
          case "${{ inputs.product }}" in
            desktop) f=CHANGELOG.md ;;
            server) f=apps/server/CHANGELOG.md ;;
            ios) f=apps/ios/CHANGELOG.md ;;
            android-phone) f=apps/android/CHANGELOG.md ;;
            android) f=apps/android-tv/CHANGELOG.md ;;
          esac
          if ! grep -q '^## Unreleased' "$f"; then
            node -e '
              const fs=require("fs"); const f=process.argv[1]; const t=fs.readFileSync(f,"utf8").split("\n");
              const i=t.findIndex(l=>/^## /.test(l));
              t.splice(i,0,"## Unreleased","","- A new build with no changes in the app.","");
              fs.writeFileSync(f,t.join("\n"));' "$f"
          fi

      - name: Bump the version and name the changelog section
        id: bump
        run: node scripts/bump-version.mjs "${{ inputs.product }}" "${{ inputs.version }}" "${{ inputs.channel }}"

      - name: The changelog must have something to say
        run: |
          if [ "${{ steps.bump.outputs.has_notes }}" != "true" ]; then
            echo "::error::${{ steps.bump.outputs.changelog }} has no '## Unreleased' section. Add what changed under it (merge it to master) and run this again."
            exit 1
          fi
          node scripts/release-notes.mjs "${{ steps.bump.outputs.changelog }}" "${{ steps.bump.outputs.full }}" > /dev/null

      - name: Commit, tag, push
        env:
          TAG: ${{ steps.bump.outputs.tag }}
          VERSION: ${{ steps.bump.outputs.full }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A second beta of the same version changes no file: tag the commit master is on.
          git diff --quiet || git commit -am "Release ${{ inputs.product }} $VERSION"
          git tag "$TAG"
          git push origin master "$TAG"

      # Pushes made with the built-in token do not start other workflows, so start the build here.
      - name: Start the build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          case "${{ inputs.product }}" in
            desktop) wf=build.yml ;;
            server) wf=server.yml ;;
            ios) wf=ios.yml ;;
            android-phone) wf=android-phone.yml ;;
            android) wf=android.yml ;;
          esac
          gh workflow run "$wf" --ref "$TAG"
          echo "Released ${{ inputs.product }} ${{ steps.bump.outputs.full }} as $TAG; the build ($wf) was started." >> "$GITHUB_STEP_SUMMARY"

      # A stable release is cut from master, not from the beta's commit: say what came in after the last beta.
      - name: What changed since the last beta
        if: ${{ inputs.channel == 'stable' }}
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          LAST=$(git tag -l "$TAG-beta.*" --sort=-v:refname | head -1)
          if [ -n "$LAST" ]; then
            { echo "### Merged since $LAST (not covered by the beta)"; git log --oneline "$LAST"..HEAD~1; } >> "$GITHUB_STEP_SUMMARY"
          fi
