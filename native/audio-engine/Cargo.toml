[package]
name = "icosahedron_audio_engine"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Port of psysonic's rodio/Symphonia gapless audio engine — see ../../NOTICE.md"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi4", "tokio_rt"] }
napi-derive = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
futures-util = "0.3"
rodio = { version = "0.22", default-features = false, features = ["playback", "symphonia-all"] }
symphonia = { version = "0.5", default-features = false, features = ["flac", "mp3", "pcm", "aac", "alac", "isomp4", "vorbis", "ogg", "wav"] }
thread-priority = "1"
# AirPlay 2 sender (https://github.com/lmcgartland/airplay2-rs, GPL-3.0-or-later).
# Pinned to a commit of our fork (branch `icosahedron`): upstream master plus the
# changes proposed upstream that this player needs — stream restarts on one
# session (track change/seek), track metadata + progress, decoding from a
# download in progress, a reliable stop(), the NTP/SETUP race fix, remote-control
# commands from the receiver, correct channel/sample-rate conversion, and
# building on Windows (airplay-audio's socket QoS via socket2). Switch back to
# upstream once those are merged. The API is explicitly unstable (alpha).
airplay-client = { git = "https://github.com/raudraido/airplay2-rs", rev = "c40921d010e7489eb7b68a1adfe673db77aeffac" }
airplay-core = { git = "https://github.com/raudraido/airplay2-rs", rev = "c40921d010e7489eb7b68a1adfe673db77aeffac" }
airplay-audio = { git = "https://github.com/raudraido/airplay2-rs", rev = "c40921d010e7489eb7b68a1adfe673db77aeffac" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
napi-build = "2"
cc = "1"
