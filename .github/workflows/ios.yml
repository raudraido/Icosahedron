name: iOS build

# Builds an UNSIGNED .ipa on a GitHub macOS runner (Xcode isn't available on the
# Linux dev box). Sign it for your own device with AltStore / Sideloadly.
on:
  push:
    branches: [feat/platform-adapter, master]
    paths: ["apps/ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Build (unsigned, device)
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild \
            -project Icosahedron.xcodeproj -scheme Icosahedron \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/Icosahedron.app

      - name: Package IPA
        working-directory: apps/ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Icosahedron.app Payload/
          zip -qry Icosahedron.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Icosahedron-unsigned-ipa
          path: apps/ios/Icosahedron.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: apps/ios/build.log
