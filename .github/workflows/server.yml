name: Server

# Tests the web engine and publishes its Docker image to GHCR:
#   server-v* tag -> ghcr.io/<owner>/icosahedron-server:X.Y.Z, :X.Y and :latest, plus a release with the changelog text
#                    (the tag must match the version in apps/server/package.json)
#   master  -> :edge
# Pull requests only run the tests. (The image bundles the web app built from src/.)
on:
  push:
    branches: [master]
    paths: ["apps/server/**", "src/**", "vite.web.config.ts", ".github/workflows/server.yml"]
    tags: ["server-v*"]
  pull_request:
    paths: ["apps/server/**", ".github/workflows/server.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/server/package-lock.json
      - run: npm ci
        working-directory: apps/server
      - run: npm test
        working-directory: apps/server

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/server-v')
        run: test "${GITHUB_REF_NAME#server-v}" = "$(node -p "require('./apps/server/package.json').version")"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/icosahedron-server
          tags: |
            type=match,pattern=server-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=server-v(\d+\.\d+)\.\d+,group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/server-v') }}
            type=edge,branch=master
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/server-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Release notes
        run: |
          VERSION="${GITHUB_REF_NAME#server-v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          node scripts/release-notes.mjs apps/server/CHANGELOG.md "$VERSION" > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Server ${{ env.VERSION }}
          body_path: release-notes.md
