name: Server

# Tests the web engine and publishes its Docker image to GHCR:
#   v* tag  -> ghcr.io/<owner>/icosahedron-server:X.Y.Z, :X.Y and :latest
#   master  -> :edge
# Pull requests only run the tests. (The image bundles the web app built from src/.)
on:
  push:
    branches: [master]
    paths: ["apps/server/**", "src/**", "vite.web.config.ts", "package.json", ".github/workflows/server.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["apps/server/**", ".github/workflows/server.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/server/package-lock.json
      - run: npm ci
        working-directory: apps/server
      - run: npm test
        working-directory: apps/server

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/icosahedron-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=master
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
